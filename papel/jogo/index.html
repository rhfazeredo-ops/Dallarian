<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dallarian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
/* VOICE: ferramenta de criação de jogo, séria por fora, mundo de fantasia vivo por dentro
   IDEA: mesa de cartógrafo do reino de Dallarian, igual ao mockup do usuário
   PICTURE: o mapa pintado ocupa o centro; painéis escuros em volta como moldura
   COLOUR and TYPE: azul-noite nos painéis, ouro do brasão, verde vivo do mapa; Cinzel no título, Archivo no resto
   LAYOUT: barra de ferramentas, assets à esquerda, mapa, prévia/propriedades/camadas/minimapa à direita; no celular vira gaveta */
:root{color-scheme:dark;--bg:#121620;--panel:#1b2130;--panel2:#232a3c;--line:#323b52;--ink:#e8ecf6;--mute:#98a2bb;--gold:#f2c04e;--blue:#3f8cff;--green:#2f9e4f}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.35 Archivo,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;height:100dvh}
header{display:flex;align-items:center;gap:6px;padding:7px 10px;background:linear-gradient(#1f2638,#161b28);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
header::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:8px;flex:none;margin-right:10px}
.brand svg{width:32px;height:36px;flex:none}
.brand h1{font:700 21px/1 Cinzel,Georgia,serif;margin:0;color:#f6ead0;white-space:nowrap}
.tb{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:8px;border:1px solid #39435d;background:#242b3d;font-weight:600;white-space:nowrap}
.tb.go{background:var(--green);border-color:#43c06a}
.tb.on{border-color:var(--blue);background:#1d3358;box-shadow:inset 0 0 0 1px var(--blue)}
.tb .ck{width:16px;height:16px;border-radius:4px;border:2px solid #7d89a6;display:inline-grid;place-items:center;font-size:11px;line-height:1}
.tb.on .ck{background:var(--blue);border-color:var(--blue)}
.tb:disabled{opacity:.4}
.sep{width:1px;height:26px;background:var(--line);flex:none;margin:0 2px}
main{display:grid;grid-template-columns:280px minmax(0,1fr) 290px;gap:8px;padding:8px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.ph{padding:9px 12px;font-weight:700;font-size:15px;background:var(--panel2);border-bottom:1px solid var(--line)}
#left .tabs{display:flex;gap:4px;padding:6px 6px 0;background:var(--panel2);border-bottom:1px solid var(--line)}
#left .tabs button{flex:1;min-height:38px;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:#1b2130;font-weight:600}
#left .tabs button.on{background:#2b4d86;border-color:#3f6bb5}
.pack{margin:8px 8px 4px;display:flex;align-items:center;gap:6px;background:#141925;border:1px solid var(--line);border-radius:8px;padding:0 8px}
.pack span{color:var(--mute);font-weight:600}
.pack select{flex:1;min-height:36px;background:transparent;border:0}
.pack select option{background:#1b2130}
#assetList{flex:1;overflow:auto;padding:0 8px 8px}
.sec h3{font-size:14px;margin:10px 2px 6px}
.sec h3::before{content:"▾ ";color:var(--mute)}
.agrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.as{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px 5px;border-radius:9px;border:1px solid transparent;background:#202739;font-size:11px;font-weight:600;line-height:1.1;text-align:center;min-height:44px}
.as img{width:50px;height:50px;object-fit:contain;display:block}
.as.on{border-color:var(--gold);background:#3a3220}
.search{margin:6px 8px 8px;display:flex;align-items:center;background:#141925;border:1px solid var(--line);border-radius:8px;padding:0 10px}
.search input{flex:1;min-height:38px;background:transparent;border:0;font-size:16px}
.search input:focus{outline:none}
#center{display:flex;flex-direction:column;min-height:0}
.maptab{display:flex;align-items:center;gap:10px;align-self:flex-start;max-width:100%;background:var(--panel2);border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;padding:0 6px 0 12px;font-weight:600;white-space:nowrap}
.maptab span{overflow:hidden;text-overflow:ellipsis}
.maptab button{border:0;background:transparent;min-height:36px;min-width:36px;color:var(--mute);font-size:16px}
#mapwrap{position:relative;flex:1;min-height:0;border:1px solid var(--line);border-radius:0 10px 10px 10px;overflow:hidden;background:#0d1119}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.tools{position:absolute;left:8px;top:8px;display:flex;gap:4px;z-index:2;max-width:calc(100% - 16px);overflow-x:auto;scrollbar-width:none}
.tools button{flex:none;min-height:38px;padding:0 11px;border-radius:8px;border:1px solid #39435d;background:#1b2130e8;font-weight:600;font-size:13px}
.tools button.on{background:var(--gold);color:#2a1d05;border-color:var(--gold)}
.zoom{position:absolute;right:8px;bottom:8px;z-index:2;display:flex;flex-direction:column;gap:4px}
.zoom button{width:44px;height:44px;border-radius:9px;border:1px solid #39435d;background:#1b2130e8;font-size:20px;font-weight:700}
#bSize{min-width:64px}
#pmini{position:absolute;right:10px;top:58px;width:128px;height:96px;border-radius:8px;border:2px solid #f3e3c0;box-shadow:0 3px 0 #0006;pointer-events:none;background:#000}
.cur{position:absolute;left:8px;bottom:8px;z-index:2;display:flex;align-items:center;gap:8px;background:#1b2130e8;border:1px solid #39435d;border-radius:8px;padding:4px 10px 4px 4px;font-weight:600;font-size:13px;pointer-events:none}
.cur img{width:30px;height:30px;object-fit:contain}
#right{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0;scrollbar-width:thin}
#right>.panel{flex:none}
.pv{padding:8px}
.pv canvas,.mm canvas{display:block;width:100%;border-radius:8px;border:2px solid #4a5675}
.pv .empty{padding:18px 10px;text-align:center;color:var(--mute);font-size:13px;border:1px dashed var(--line);border-radius:8px}
.props{padding:10px;display:grid;gap:9px}
.props .hd{display:flex;align-items:center;gap:10px}
.props .hd img{width:46px;height:46px;object-fit:contain;background:#202739;border-radius:8px;border:1px solid var(--line)}
.props .hd b{display:block}
.props .hd small{color:var(--mute)}
.fl{display:grid;grid-template-columns:92px minmax(0,1fr);align-items:center;gap:8px}
.fl label{color:#cfd6e6;font-size:13px}
.fl.col{grid-template-columns:1fr}
.props select,.props input[type=text],.props textarea{width:100%;min-height:38px;background:#141925;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:16px}
.props textarea{min-height:70px;resize:vertical}
.props .chk{display:flex;align-items:center;gap:8px;font-size:13px}
.props .chk input{width:20px;height:20px;accent-color:var(--blue)}
.danger{min-height:40px;border-radius:8px;border:1px solid #7a3340;background:#3a1f27;color:#ffc2cb;font-weight:600}
.layers{padding:4px 0}
.ly{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 12px;border:0;border-left:3px solid transparent;background:transparent;text-align:left;font-weight:600}
.ly svg{width:20px;height:20px;flex:none}
.ly i{width:16px;height:16px;border-radius:4px;flex:none;box-shadow:inset 0 -3px 0 #0004}
.ly.off{color:#6b748c}
.ly.off svg{opacity:.4}
.ly.act{background:#2b4d86;border-left-color:var(--gold)}
.mm{padding:8px}
.status{display:flex;gap:16px;align-items:center;padding:7px 12px;background:#161b28;border-top:1px solid var(--line);font-size:13px;color:#cfd6e6;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.status span{flex:none}
.status .ok{margin-left:auto;font-weight:700;color:#5fd47a}
.status .bad{margin-left:auto;font-weight:700;color:#ffb347}
#mtabs{display:none}
#toast{position:fixed;left:50%;top:64px;transform:translate(-50%,-10px);opacity:0;z-index:50;background:var(--gold);color:#2a1d05;font-weight:700;padding:9px 16px;border-radius:10px;transition:.25s;pointer-events:none;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#sheet{position:fixed;inset:0;z-index:40;background:#000a;display:flex;align-items:center;justify-content:center;padding:12px}
#sheet[hidden]{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(520px,100%);max-height:88dvh;overflow:auto;padding:16px;display:grid;gap:10px}
.card h2{margin:0;font:700 20px Cinzel,Georgia,serif}
.card p{margin:0;color:var(--mute)}
.card .row{display:flex;gap:8px}
.card .row>*{flex:1}
.card input,.card select,.card textarea{width:100%;min-height:42px;background:#141925;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:16px}
.card textarea{min-height:140px;font:13px/1.4 ui-monospace,monospace}
.card .btn{min-height:44px;border-radius:9px;border:1px solid #39435d;background:#242b3d;font-weight:600}
.card .pri{background:var(--green);border-color:#43c06a}
.mapitem{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:6px;border-radius:9px;border:1px solid var(--line);background:#202739;text-align:left}
.mapitem img{width:64px;height:46px;border-radius:6px;object-fit:cover}
.mapitem.on{border-color:var(--gold)}
.mapitem small{display:block;color:var(--mute)}
/* jogo */
#play{position:fixed;inset:0;z-index:30;background:#000;display:none;touch-action:none;user-select:none}
#play.on{display:block}
#pcv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:10px;top:10px;display:grid;gap:6px;pointer-events:none}
.hearts{display:flex;gap:3px}
.hearts svg{width:24px;height:22px}
.items{font-size:12px;font-weight:700;color:#fff;background:#0009;border-radius:8px;padding:4px 8px}
.mapname{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#f3e3c0;color:#3a2a1e;border:2px solid #7a4b2a;border-radius:8px;padding:5px 14px;font:700 15px Cinzel,Georgia,serif;white-space:nowrap;pointer-events:none}
#exitPlay{position:absolute;right:10px;top:10px;min-height:40px;padding:0 14px;border-radius:9px;border:1px solid #ffffff55;background:#000a;color:#fff;font-weight:700}
#joy{position:absolute;width:120px;height:120px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff55;display:none;pointer-events:none}
#knob{position:absolute;left:33px;top:33px;width:54px;height:54px;border-radius:50%;background:#ffffffaa}
#btnA{position:absolute;right:22px;bottom:34px;width:86px;height:86px;border-radius:50%;border:3px solid #7a4b2a;background:radial-gradient(circle at 35% 30%,#ffe9a8,#f2c04e 60%,#c48a1e);color:#3a2a1e;font:800 28px Archivo;box-shadow:0 6px 0 #7a4b2a}
#btnA small,#btnB small{display:block;font-size:11px;font-weight:700}
#btnB{position:absolute;right:118px;bottom:24px;width:70px;height:70px;border-radius:50%;border:3px solid #24407a;background:radial-gradient(circle at 35% 30%,#bcd4ff,#5f8fe8 60%,#2f56b0);color:#0f1d3a;font:800 22px Archivo;box-shadow:0 5px 0 #24407a}
#btnB.cd{filter:grayscale(.8) brightness(.7)}
#btnPot{position:absolute;right:196px;bottom:22px;width:56px;height:56px;border-radius:50%;border:3px solid #2a6a3a;background:radial-gradient(circle at 35% 30%,#d4ffd8,#5fcf75 60%,#2e8c48);font-size:22px;box-shadow:0 4px 0 #2a6a3a;display:flex;align-items:center;justify-content:center;gap:1px;flex-direction:column;line-height:1}
#shop.profile{padding:0;background:radial-gradient(ellipse at 30% 40%,#3a2c22f0,#120d0bf6)}
.prof{width:100%;height:100%;display:flex;flex-direction:column;color:#f3e3c0;padding:10px 14px;box-sizing:border-box;font-family:Archivo,sans-serif}
.ptop{display:flex;align-items:center;gap:10px}.plvl{width:46px;height:46px;border-radius:50%;border:4px solid #d8433a;background:#1a1210;display:flex;align-items:center;justify-content:center;font:900 18px Archivo;box-shadow:0 0 0 3px #1a1210}
.phead{flex:1;display:flex;flex-direction:column;gap:4px}.phead b{font:800 17px Georgia,serif}.phead i,.pbar i{display:block;height:10px;background:#0008;border-radius:2px 8px 8px 2px;overflow:hidden;transform:skewX(-12deg)}.phead u,.pbar u{display:block;height:100%;background:linear-gradient(90deg,#9c1c24,#ff4a4a)}
.pgold{font:900 20px Archivo;color:#ffd34a;text-shadow:0 2px 0 #000}#shop.profile #shopX{width:42px;height:42px;border-radius:50%;border:2px solid #f3e3c0;background:#0006;color:#f3e3c0;font-size:18px}
.pbody{flex:1;display:flex;gap:14px;min-height:0;margin-top:14px}.pleft{width:44%;display:flex;flex-direction:column;gap:4px;min-width:0}.pright{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
.phero{display:flex;align-items:center;justify-content:center;gap:6px;flex:1;min-height:0}.phero canvas{height:190px;width:auto;flex:none}.pcol{display:flex;flex-direction:column;gap:12px}
.pslot{width:46px;height:46px;margin:9px 6px;transform:rotate(45deg);border:3px solid #6a5a4a;background:#1a1210cc;display:flex;align-items:center;justify-content:center;position:relative;border-radius:6px;padding:0}.pslot>*{transform:rotate(-45deg)}.pslot .aic{font-size:26px}.pslot.vazio span{color:#6a5a4a;font-size:22px}
.pslot.r1{border-color:#c99a4a}.pslot.r2{border-color:#4a8fe8}.pslot.r3{border-color:#b45ae8}.pslot.sel{box-shadow:0 0 0 3px #ff4a4a}
.plv{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:#1a1210;border:2px solid #c99a4a;font:900 11px Archivo;display:flex;align-items:center;justify-content:center;color:#fff}.plv.r2{border-color:#4a8fe8}.plv.r3{border-color:#b45ae8}
.pslot .plv{top:-10px;right:auto;left:16px;transform:rotate(-45deg)}
.pst{display:flex;gap:14px;font-size:13px}.pbar{display:flex;flex-direction:column;gap:2px;font-size:12px}.pbar i{height:7px}
.ptabs{display:flex;gap:6px;margin-bottom:6px}.ptabs button{padding:6px 16px;border-radius:999px;border:0;background:transparent;color:#f3e3c0;font:800 14px Archivo}.ptabs button.on{background:linear-gradient(90deg,#9c1c24,#e8343f);transform:skewX(-10deg)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;overflow:auto;padding:4px 2px}
.pcard{position:relative;height:104px;border:3px solid #4a3a2e;background:#1a1210e0;color:#f3e3c0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;border-radius:4px}.pcard.r1{border-color:#8a6a3a}.pcard.r2{border-color:#2f6fd0}.pcard.r3{border-color:#8a3fc8}.pcard.sel{border-color:#ff4a4a;box-shadow:0 0 12px #ff4a4a88}
.pcard .aic{font-size:36px}.pcard .anm{font:700 11px Archivo;text-align:center;line-height:1.1}.pcard .plv{top:4px;right:4px}.pcard .peq{position:absolute;left:4px;top:4px;font:800 9px Archivo;color:#7dff9a;font-style:normal}.pcard.vazio{opacity:.4;border-style:dashed}.pcard.vazio span{font-size:28px}.pcard.vazio small{font-size:10px}
.pdet{display:flex;gap:10px;align-items:center;background:#0006;border:2px solid #6a5a4a;border-radius:8px;padding:6px 10px;margin-bottom:6px;font-size:12px}.pdet .aic{font-size:34px}.pdet>div{flex:1}.pdet b{font-size:14px}.rar{font-style:normal;font-size:11px}.rar.r1{color:#e0b060}.rar.r2{color:#6aa8ff}.rar.r3{color:#c88aff}
.pdet button{min-height:40px;padding:0 16px;border:0;background:linear-gradient(90deg,#9c1c24,#e8343f);color:#fff;font:800 14px Archivo;transform:skewX(-10deg)}
.ppot{display:flex;gap:12px;align-items:center;background:#0006;border:2px solid #6a5a4a;border-radius:8px;padding:12px;font-size:13px}.ppot .aic{font-size:44px}.pdica{opacity:.6;font-size:11px;margin-top:4px}
@media (orientation:portrait){.pbody{flex-direction:column;overflow:auto}.pleft{width:100%}.phero canvas{max-height:200px}}
#hudBtns{position:absolute;left:16px;top:104px;display:flex;gap:8px}#hudBtns button{min-height:38px;padding:0 12px;border-radius:9px;border:2px solid #7a4b2a;background:#f3e3c0;color:#3a2a1e;font:700 14px Archivo;box-shadow:0 3px 0 #0005}
.art{display:flex;flex-direction:column;align-items:center;justify-content:center;width:86px;height:96px;border-radius:10px;border:3px solid #c9a06a;background:#fff6e0;color:#3a2a1e;padding:4px;position:relative}.art.r2{border-color:#2f6fd0;background:#eaf2ff}.art.r3{border-color:#8a3fc8;background:#f5ebff}.art.sel{box-shadow:0 0 0 3px #e8343f}
.art .aic{font-size:32px;line-height:1.1}.art .alv{position:absolute;top:3px;right:5px;font:800 11px Archivo;color:#8a5a12}.art .anm{font-size:11px;font-weight:700;text-align:center;line-height:1.1}.art.vazio{border-style:dashed;opacity:.55;font-size:12px}
.agrid2{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}.slist h4{margin:8px 4px 2px;font-size:14px;color:#7a4b2a}.stats{display:flex;flex-wrap:wrap;gap:6px}.stats span{background:#fff6e0;border:1px solid #c9a06a;border-radius:8px;padding:3px 8px;font-size:12px}
.adet{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid #7a4b2a;border-radius:10px;padding:8px;margin:6px 0}.adet>div{flex:1;font-size:13px}.adet .big{font-size:40px}.adet button{min-height:40px;padding:0 14px;border-radius:9px;border:0;background:#7a4b2a;color:#f3e3c0;font-weight:800}
.mapbox{display:flex;gap:10px;align-items:flex-start}.mapbox canvas{flex:1;min-width:0;width:100%;height:auto;border-radius:8px;border:2px solid #7a4b2a}.wlist{width:190px;flex:none}.wrow{display:flex;flex-direction:column;padding:5px 6px;border-radius:7px;font-size:13px}.wrow.here{background:#ffe9a8}.wrow small{font-size:11px;opacity:.8}
@media (orientation:portrait){.mapbox{flex-direction:column}.wlist{width:100%}}
#shop>.shead,#shop>.slist{width:min(760px,100%)}
#btnPot small{font:800 11px Archivo;color:#0d2a14}
.gold{color:#ffd34a}
#shop{position:absolute;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:30;padding:12px}
#shop>.shead,#shop>.slist{width:min(560px,100%)}
#shop{flex-direction:column;gap:0}
.shead{display:flex;align-items:center;gap:10px;background:#7a4b2a;color:#f3e3c0;padding:10px 12px;border-radius:12px 12px 0 0}
.shead>div{flex:1;display:flex;flex-direction:column}.shead span{font-size:12px;opacity:.85}
.shead button{min-height:36px;padding:0 12px;border-radius:8px;border:0;background:#f3e3c0;color:#3a2a1e;font-weight:800}
.slist{color:#3a2a1e;background:#f3e3c0;border:3px solid #7a4b2a;border-top:0;border-radius:0 0 12px 12px;max-height:min(70vh,520px);overflow:auto;padding:6px}
.sit{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff6e0;border:2px solid #c9a06a;border-radius:10px;padding:8px 10px;margin:4px 0;color:#3a2a1e}
.sit .sic{font-size:28px;width:38px;text-align:center}.sit .stx{flex:1;display:flex;flex-direction:column}.sit .stx small{font-size:12px;opacity:.8}
.sit .spr{font-weight:800;color:#8a5a12;white-space:nowrap}.sit.poor .spr{color:#b03a2e}.sit.off{opacity:.5}
#rot{position:absolute;inset:0;z-index:40;background:#1d2a14ee;color:#f3e3c0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
#rot>div{max-width:320px}#rot .rph{font-size:54px;margin-bottom:8px}#rot b{font-size:20px}#rot p{opacity:.85;font-size:14px}

function qActiveFrom(name){return QUESTS.find(q=>q.de===name&&qState(q.id)&&qState(q.id).st!=='feita')}
function qMark(name){const a=qActiveFrom(name);if(a)return qState(a.id).st==='pronta'?'?':'…';return qOffer(name)?'!':''}
function qProgress(q,v){const st=qState(q.id);if(!st||st.st!=='ativa')return;st.c=Math.min(q.n,v);if(st.c>=q.n){st.st='pronta';toast(`Missão cumprida: ${q.t}! Volte a falar com ${q.de}.`)}qTrack();saveProg()}
function qEvent(tipo,v){QUESTS.forEach(q=>{const st=qState(q.id);if(!st||st.st!=='ativa'||q.tipo!==tipo)return;
 if(tipo==='kill'&&q.alvo.includes(v))qProgress(q,(st.c||0)+1);
 else if(tipo==='talk'&&q.alvo===v)qProgress(q,1);
 else if(tipo==='item'&&q.alvo===v)qProgress(q,1);
 else if(tipo==='map'&&q.alvo.includes(v)){st.vis=st.vis||[];if(!st.vis.includes(v))st.vis.push(v);qProgress(q,st.vis.length)}
 else if(tipo==='estatua')qProgress(q,v);
 else if(tipo==='boss'&&q.alvo===v)qProgress(q,1)})}
function qStart(q){play.q[q.id]={st:'ativa',c:0};
 if(q.tipo==='item'&&play.items.includes(q.alvo))qProgress(q,1);
 if(q.tipo==='estatua')qProgress(q,play.lit.size);
 if(q.tipo==='map'){const st=play.q[q.id];st.vis=(play.visited||[]).filter(x=>q.alvo.includes(x));qProgress(q,st.vis.length)}
 toast('Nova missão: '+q.t);qTrack();saveProg()}

const elevAt=(x,y)=>{const m=play.m,X=Math.floor(x),Y=Math.floor(y);return inb(m,X,Y)?play.el[Y*m.w+X]:0};
function canAt(x,y,r,ce){for(const[px,py]of[[x-r,y-.25],[x+r,y-.25],[x-r,y-.02],[x+r,y-.02]]){if(pcell(px,py))return false;if(ce!==-1){const v=elevAt(px,py);if(v!==-1&&v!==ce)return false}}return true}
function moveEnt(e,dx,dy,r){const ce=elevAt(e.x,e.y-.1);let ok=true;
 if(dx){if(canAt(e.x+dx,e.y,r,ce))e.x+=dx;else{ok=false;const c=Math.floor(e.y-.1)+.6,d=c-e.y;if(Math.abs(d)<.45&&canAt(e.x+dx,c,r,ce))e.y+=Math.sign(d)*Math.min(Math.abs(d),Math.abs(dx))}}
