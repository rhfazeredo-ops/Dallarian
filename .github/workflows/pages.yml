name: Publicar no GitHub Pages
# A cada envio ao main: exporta a versão Web do Godot e publica no site do repositório.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      # arte comprada (modelos da Synty): fica num repositório PRIVADO e só entra na hora de gerar o jogo
      - uses: actions/checkout@v4
        with:
          repository: rhfazeredo-ops/dallarian-arte
          token: ${{ secrets.ARTE_TOKEN }}
          path: godot/arte
      - uses: actions/cache@v4
        continue-on-error: true
        with: { path: "~/godot-4.5-stable\n~/.local/share/godot/export_templates", key: godot-4.5-stable }
      - run: tools/godot-ci.sh
      - run: |
          cd godot && godot --headless --import || true
          # terreno de longe pronto (alturas e cores do mapa inteiro) vai dentro do jogo: o celular não precisa calcular
          godot --headless --path . res://cenas/mundo.tscn -- --gerar_terreno && ls -la dados/
          mkdir -p ../dist && godot --headless --export-release "Web" ../dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      # o GitHub às vezes não acha o pacote recém-enviado: espera e tenta de novo
      - id: d
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.d.outcome == 'failure'
        run: sleep 20
      - id: d2
        if: steps.d.outcome == 'failure'
        uses: actions/deploy-pages@v4
