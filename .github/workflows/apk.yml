name: Gerar APK
# A cada envio ao main: exporta a versão Godot para Android e publica em Releases (tag "apk"): o APK, o pacote do
# jogo (dallarian.pck) e o versao.json — o APK instalado confere o versao.json ao abrir e baixa o pacote novo.
on:
  push:
    branches: [main]
    paths: ["godot/**", ".github/workflows/apk.yml", "tools/godot-ci.sh"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: apk, cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # arte comprada (modelos da Synty): fica num repositório PRIVADO e só entra na hora de gerar o jogo
      - uses: actions/checkout@v4
        with:
          repository: rhfazeredo-ops/dallarian-arte
          token: ${{ secrets.ARTE_TOKEN }}
          path: godot/arte
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/cache@v4
        with: { path: "~/godot-4.5-stable\n~/.local/share/godot/export_templates", key: godot-4.5-stable }
      - run: tools/godot-ci.sh
      # mesma chave de assinatura entre versões (o APK novo instala por cima do antigo)
      - uses: actions/cache@v4
        with: { path: ~/debug.keystore, key: dallarian-keystore }
      - name: Configurar Android no Godot
        run: |
          [ -f ~/debug.keystore ] || keytool -genkeypair -keystore ~/debug.keystore -alias androiddebugkey -storepass android \
            -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 9999
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.5.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.5.tres
      - run: |
          # número da versão (aumenta a cada execução): vai dentro do APK e no versao.json da Release
          echo "{\"n\": ${GITHUB_RUN_NUMBER}}" > godot/versao.json
          python3 tools/podar_arte.py godot      # só os modelos/texturas dos pacotes que o jogo usa
          cd godot && godot --headless --import || true
          # terreno de longe pronto (alturas e cores do mapa inteiro) vai dentro do jogo: o celular não precisa calcular
          godot --headless --path . res://cenas/mundo.tscn -- --gerar_terreno && ls -la dados/
          mkdir -p ../dist && godot --headless --export-debug "Android" ../dist/dallarian.apk
          # pacote do jogo (sem o "motor"): o APK já instalado baixa só ele e atualiza sozinho ao abrir
          godot --headless --export-pack "Android" ../dist/dallarian.pck
          echo "{\"n\": ${GITHUB_RUN_NUMBER}, \"tamanho\": $(stat -c %s ../dist/dallarian.pck)}" > ../dist/versao.json
          cat ../dist/versao.json; ls -la ../dist
      - name: Publicar em Releases
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk dist/dallarian.apk dist/dallarian.pck dist/versao.json --prerelease --title "Dallarian — APK de teste" \
            --notes "Gerado a partir do commit ${GITHUB_SHA::7}."
          # o gh cria a Release como rascunho enquanto sobe os arquivos e às vezes não publica no fim: publica aqui
          gh release edit apk --draft=false --prerelease
          gh release view apk --json isDraft,assets --jq '{rascunho: .isDraft, arquivos: [.assets[].name]}'
